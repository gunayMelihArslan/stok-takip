
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stok Takip Sistemi — Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #11151a;
    --border: #1e2530;
    --accent: #e8b84b;
    --accent2: #4be8a0;
    --text: #e2e8f0;
    --muted: #5a6478;
    --danger: #e84b4b;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,184,75,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,184,75,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 2rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to { opacity:1; transform: translateY(0); }
  }

  .brand {
    margin-bottom: 2.5rem;
    text-align: center;
  }
  .brand-icon {
    width: 56px; height: 56px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 1.5rem;
  }
  .brand h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
  }
  .brand p {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.25rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
  }

  .field { margin-bottom: 1.25rem; }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--accent);
    color: #0a0c0f;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    background: rgba(232,75,75,0.1);
    border: 1px solid rgba(232,75,75,0.3);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--danger);
    margin-top: 1rem;
    display: none;
  }

  .footer {
    text-align: center;
    margin-top: 1.5rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
  }
  .footer span { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="brand-icon">🏭</div>
    <h1>Stok Takip</h1>
    <p>Yönetim Sistemi v1.0</p>
  </div>
  <div class="card">
    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="kullaniciadi" autocomplete="username">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Giriş Yap</button>
    <div class="error" id="errMsg"></div>
  </div>
  <div class="footer">Yerel ağ · <span>Güvenli bağlantı</span></div>
</div>

<script>
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errMsg');
    err.style.display = 'none';
    if (!username || !password) {
      err.textContent = 'Kullanıcı adı ve şifre giriniz';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Giriş yapılıyor...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('stok_token', data.token);
      window.location.href = data.role === 'admin' ? '/admin.html' : '/personnel.html';
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
    }
  }

  // Auto redirect if already logged in
  const t = localStorage.getItem('stok_token');
  if (t) {
    fetch('/api/me', {headers:{'Authorization':'Bearer '+t}}).then(r => r.ok ? r.json() : null).then(u => {
      if (u) window.location.href = u.role === 'admin' ? '/admin.html' : '/personnel.html';
    });
  }
</script>
</body>
</html>
