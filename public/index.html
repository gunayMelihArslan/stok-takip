<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Takip Sistemi - Giriş</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="card-header" style="justify-content: center;">
        <h2>Envanter Girişi</h2>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">Giriş Yap</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Giriş başarısız');

        showToast('Giriş başarılı, yönlendiriliyorsunuz...', 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin.html' : '/personnel.html';
        }, 800);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
