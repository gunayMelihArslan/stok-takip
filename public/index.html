<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elektrikhane — Sekizli Makina & Vinç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c0f; --surface:#11151a; --border:#1e2530; --border2:#262f3e;
    --accent:#f0d800; --accent2:#1a6b56; --text:#e2e8f0; --muted:#5a6478;
    --danger:#e84b4b; --mono:'JetBrains Mono',monospace; --sans:'Syne',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(26,107,86,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,107,86,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .container{width:100%;max-width:400px;padding:1.5rem;position:relative;z-index:1;animation:fadeUp .4s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .brand{margin-bottom:2rem;text-align:center;}
  .logo-wrap{background:#fff;border-radius:12px;padding:.75rem 1.5rem;display:inline-block;margin-bottom:1rem;}
  .logo-wrap img{height:48px;width:auto;display:block;}
  .unit-badge{display:inline-block;background:var(--accent2);color:#fff;font-family:var(--mono);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;padding:.25rem .85rem;border-radius:20px;margin-top:.35rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem;}
  .field{margin-bottom:1.1rem;}
  .field label{display:block;font-family:var(--mono);font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.4rem;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:.7rem 1rem;color:var(--text);font-family:var(--mono);font-size:.88rem;outline:none;transition:border-color .2s;-webkit-appearance:none;}
  .field input:focus{border-color:var(--accent);}
  .btn{width:100%;padding:.85rem;background:var(--accent);color:#0a0c0f;border:none;border-radius:8px;font-family:var(--sans);font-size:.92rem;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:.25rem;}
  .btn:hover{opacity:.9;} .btn:active{transform:scale(.98);} .btn:disabled{opacity:.45;cursor:not-allowed;}
  .error{background:rgba(232,75,75,.1);border:1px solid rgba(232,75,75,.3);border-radius:8px;padding:.65rem 1rem;font-family:var(--mono);font-size:.75rem;color:var(--danger);margin-top:.85rem;display:none;}
  .footer{text-align:center;margin-top:1.25rem;font-family:var(--mono);font-size:.62rem;color:var(--muted);}
  .footer span{color:var(--accent2);}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="logo-wrap"><img src="/logo.png" alt="Sekizli Makina & Vinç"></div>
    <div><span class="unit-badge">⚡ Elektrikhane</span></div>
  </div>
  <div class="card">
    <div class="field"><label>Kullanıcı Adı</label><input type="text" id="username" placeholder="kullaniciadi" autocomplete="username"></div>
    <div class="field"><label>Şifre</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" onclick="login()">Giriş Yap</button>
    <div class="error" id="errMsg"></div>
  </div>
  <div class="footer">Sekizli Makina & Vinç A.Ş. · <span>Elektrikhane Sistemi</span></div>
</div>
<script>
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');const err=document.getElementById('errMsg');
  err.style.display='none';
  if(!username||!password){err.textContent='Kullanıcı adı ve şifre giriniz';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Giriş yapılıyor...';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error);
    localStorage.setItem('stok_token',data.token);
    if(data.role === 'admin') window.location.href = '/admin.html';
    else if(data.role === 'purchase') window.location.href = '/purchase.html';
    else window.location.href = '/personnel.html';
  }catch(e){err.textContent=e.message;err.style.display='block';btn.disabled=false;btn.textContent='Giriş Yap';}
}
const t=localStorage.getItem('stok_token');
if(t){
  fetch('/api/me',{headers:{'Authorization':'Bearer '+t}})
    .then(r=>r.ok?r.json():null)
    .then(u=>{
      if(u){
        if(u.role === 'admin') window.location.href = '/admin.html';
        else if(u.role === 'purchase') window.location.href = '/purchase.html';
        else window.location.href = '/personnel.html';
      }
    });
}
</script>
</body>
</html>
