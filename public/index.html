<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş - Stok ve İş Takip Portalı</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Logo" class="brand-logo" style="height: 60px; margin-bottom: 1rem;" onerror="this.style.display='none'">
      <h2 style="color: var(--primary); margin-bottom: 0.5rem;">Stok & İş Takip Portalı</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Lütfen kullanıcı bilgilerinizle oturum açın</p>
      
      <form id="loginForm" style="text-align: left;">
        <div class="form-group">
          <label>Kullanıcı Adı</label>
          <input type="text" id="username" placeholder="admin veya personel" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" id="loginBtn">Oturum Aç</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Giriş başarısız.');

        showToast('Giriş başarılı, yönlendiriliyorsunuz...');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin.html' : '/personnel.html';
        }, 600);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
