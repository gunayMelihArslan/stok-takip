<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetim Paneli - Stok Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Stok Yönetim Paneli</div>
    <div>
      <span id="userGreeting" style="margin-right: 1rem; font-weight: 600;"></span>
      <button class="btn btn-danger btn-sm" id="logoutBtn">Çıkış Yap</button>
    </div>
  </nav>

  <div class="container">
    <!-- Yeni Ürün Ekleme -->
    <div class="card">
      <div class="card-header">
        <h3>Yeni Malzeme / Ürün Tanımla</h3>
      </div>
      <form id="addProductForm" class="grid">
        <div class="form-group">
          <label>Ürün Kodu *</label>
          <input type="text" id="pCode" placeholder="Örn: RLM-6204" required>
        </div>
        <div class="form-group">
          <label>Ürün Adı *</label>
          <input type="text" id="pName" placeholder="Örn: Rulman 6204 ZZ" required>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <input type="text" id="pCategory" placeholder="Mekanik, Elektrik vb.">
        </div>
        <div class="form-group">
          <label>Başlangıç Stoğu *</label>
          <input type="number" id="pStock" min="0" value="0" required>
        </div>
        <div class="form-group">
          <label>Kritik Eşik *</label>
          <input type="number" id="pMinStock" min="0" value="5" required>
        </div>
        <div class="form-group">
          <label>Birim</label>
          <input type="text" id="pUnit" value="Adet">
        </div>
        <div style="grid-column: 1 / -1;">
          <button type="submit" class="btn btn-primary" id="saveProductBtn">Ürünü Kaydet</button>
        </div>
      </form>
    </div>

    <!-- Stok Listesi -->
    <div class="card">
      <div class="card-header">
        <h3>Envanter Durumu</h3>
        <input type="text" id="searchBox" placeholder="İsim, kod veya kategori ara..." style="max-width: 300px;">
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kod</th>
              <th>Ürün Adı</th>
              <th>Kategori</th>
              <th>Mevcut Stok</th>
              <th>Kritik Eşik</th>
              <th>Durum</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Son Hareketler -->
    <div class="card">
      <div class="card-header">
        <h3>Son Stok Hareketleri (Audit Log)</h3>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Tarih</th>
              <th>Kullanıcı</th>
              <th>Ürün</th>
              <th>İşlem</th>
              <th>Miktar</th>
              <th>Önce/Sonra</th>
              <th>Açıklama</th>
            </tr>
          </thead>
          <tbody id="logsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.user.role !== 'admin') {
          window.location.href = '/personnel.html';
        }
        document.getElementById('userGreeting').textContent = `Yönetici: ${data.user.username}`;
      } catch {
        window.location.href = '/index.html';
      }
    }

    async function loadProducts(search = '') {
      try {
        const res = await fetch(`/api/products?search=${encodeURIComponent(search)}`);
        const data = await res.json();
        const tbody = document.getElementById('productTableBody');
        tbody.textContent = ''; // XSS koruması

        data.products.forEach(p => {
          const tr = document.createElement('tr');

          const tdCode = document.createElement('td'); tdCode.textContent = p.code;
          const tdName = document.createElement('td'); tdName.textContent = p.name;
          const tdCat = document.createElement('td'); tdCat.textContent = p.category;
          const tdStock = document.createElement('td'); tdStock.textContent = `${p.stock} ${p.unit}`;
          const tdMin = document.createElement('td'); tdMin.textContent = `${p.min_stock} ${p.unit}`;
          
          const tdStatus = document.createElement('td');
          const badge = document.createElement('span');
          if (p.stock <= p.min_stock) {
            badge.className = 'badge badge-danger';
            badge.textContent = 'Kritik Seviye';
          } else {
            badge.className = 'badge badge-success';
            badge.textContent = 'Yeterli';
          }
          tdStatus.appendChild(badge);

          const tdActions = document.createElement('td');
          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-danger btn-sm';
          delBtn.textContent = 'Sil';
          delBtn.onclick = () => deleteProduct(p.id);
          tdActions.appendChild(delBtn);

          tr.append(tdCode, tdName, tdCat, tdStock, tdMin, tdStatus, tdActions);
          tbody.appendChild(tr);
        });
      } catch (err) {
        showToast('Ürün listesi yüklenemedi.', 'error');
      }
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/logs');
        const data = await res.json();
        const tbody = document.getElementById('logsTableBody');
        tbody.textContent = '';

        data.logs.forEach(l => {
          const tr = document.createElement('tr');
          
          const tdDate = document.createElement('td'); tdDate.textContent = new Date(l.created_at).toLocaleString('tr-TR');
          const tdUser = document.createElement('td'); tdUser.textContent = l.username;
          const tdProd = document.createElement('td'); tdProd.textContent = `${l.product_name} (${l.product_code})`;
          
          const tdAction = document.createElement('td');
          tdAction.textContent = l.action_type === 'IN' ? 'Giriş' : 'Çıkış';
          tdAction.style.color = l.action_type === 'IN' ? 'var(--success)' : 'var(--danger)';
          tdAction.style.fontWeight = 'bold';

          const tdQty = document.createElement('td'); tdQty.textContent = l.quantity;
          const tdPrevNext = document.createElement('td'); tdPrevNext.textContent = `${l.previous_stock} -> ${l.new_stock}`;
          const tdNote = document.createElement('td'); tdNote.textContent = l.note || '-';

          tr.append(tdDate, tdUser, tdProd, tdAction, tdQty, tdPrevNext, tdNote);
          tbody.appendChild(tr);
        });
      } catch (err) {
        showToast('Loglar alınamadı.', 'error');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
      try {
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast(data.message);
        loadProducts();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveProductBtn');
      btn.disabled = true;

      const payload = {
        code: document.getElementById('pCode').value,
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        stock: document.getElementById('pStock').value,
        min_stock: document.getElementById('pMinStock').value,
        unit: document.getElementById('pUnit').value
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showToast('Ürün başarıyla eklendi.');
        document.getElementById('addProductForm').reset();
        loadProducts();
        loadLogs();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('searchBox').addEventListener('input', (e) => {
      loadProducts(e.target.value);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    checkAuth().then(() => {
      loadProducts();
      loadLogs();
    });
  </script>
</body>
</html>
