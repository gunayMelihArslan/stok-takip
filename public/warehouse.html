<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depo & Mal Kabul — Sekizli ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070b; --panel: #0d131e; --card: #151f30; --border: #1e2d42;
      --green: #1a6b56; --glow: #3cd4a0; --accent: #e8b84b; --danger: #ff4d4d;
      --text: #f8fafc; --dim: #94a3b8; --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar {
      background: var(--panel); border-bottom: 2px solid var(--green); padding: 0.75rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 0.7rem; }
    .brand img { height: 26px; background: #fff; padding: 2px 6px; border-radius: 5px; }
    .tabs { display: flex; gap: 0.4rem; padding: 0.7rem 1.25rem; background: #080d14; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { background: var(--panel); border: 1px solid var(--border); color: var(--dim); padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--green); border-color: var(--glow); color: #fff; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 1.1rem; }
    .view { display: none; } .view.active { display: block; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 0.9rem; }
    .po-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0.65rem; margin-bottom: 0.7rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 0.55rem 0.6rem; background: var(--card); color: var(--dim); font-size: 0.72rem; text-transform: uppercase; }
    td { padding: 0.55rem 0.6rem; border-bottom: 1px solid rgba(30,45,66,0.5); }
    .mono { font-family: var(--mono); }
    .btn { background: var(--green); color: #fff; border: 1px solid var(--glow); padding: 0.45rem 0.85rem; border-radius: 7px; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
    .btn-sec { background: var(--card); border-color: var(--border); color: var(--text); }
    .badge { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.45rem; border-radius: 5px; }
    .b-warn { background: rgba(232,184,75,0.16); color: var(--accent); }
    .b-green { background: rgba(60,212,160,0.15); color: var(--glow); }
    input, textarea { background: #080d14; border: 1px solid var(--border); color: #fff; padding: 0.5rem 0.65rem; border-radius: 7px; width: 100%; font-size: 0.82rem; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--green); border-radius: 12px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 1.15rem; }
    .toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--green); color: #fff; padding: 0.65rem 1rem; border-radius: 8px; font-weight: 700; display: none; z-index: 2000; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/logo.png" alt="Sekizli" onerror="this.style.display='none'">
    <div>
      <div style="font-family:var(--mono);font-size:0.65rem;color:var(--glow)">SEKİZLİ DEPO OPERASYON</div>
      <div style="font-weight:800;font-size:1rem">Depo & İrsaliye Mal Kabul</div>
    </div>
  </div>
  <div style="display:flex;gap:0.5rem;align-items:center">
    <span id="userLabel" style="font-family:var(--mono);font-size:0.75rem;color:var(--dim)"></span>
    <button class="btn btn-sec" onclick="logout()">Çıkış</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="showView('pending', this)">📦 Bekleyen Siparişler (Mal Kabul)</button>
  <button class="tab" onclick="showView('waybills', this)">🧾 İrsaliye Geçmişi</button>
  <button class="tab" onclick="showView('stock', this)">📊 Canlı Depo Stokları</button>
</nav>

<main class="wrap">
  <section id="view-pending" class="view active">
    <div id="pendingPoList">Yükleniyor...</div>
  </section>

  <section id="view-waybills" class="view">
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Tarih</th><th>İrsaliye No</th><th>Bağlı PO</th><th>Tedarikçi</th><th>Teslim Alan</th><th>Kalite Notu</th></tr></thead>
        <tbody id="wbTbody"></tbody>
      </table>
    </div>
  </section>

  <section id="view-stock" class="view">
    <div class="card">
      <input id="stockSearch" placeholder="🔍 Depoda ürün ara..." oninput="renderStock()" style="max-width:320px;margin-bottom:0.8rem">
      <div style="overflow-x:auto">
        <table>
          <thead><tr id="stockHead"></tr></thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- MAL KABUL MODALI -->
<div class="modal-bg" id="receiveModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem">
      <h3 id="recTitle">Mal Kabul</h3>
      <button class="btn btn-sec" onclick="closeRec()">✕</button>
    </div>
    <input type="hidden" id="recPoId">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.8rem">
      <div><label style="font-size:0.72rem;color:var(--dim)">İrsaliye No *</label><input id="recWbNo" placeholder="IRS2026..."></div>
      <div><label style="font-size:0.72rem;color:var(--dim)">İrsaliye Fotoğraf / Link</label><input id="recAttach" placeholder="Opsiyonel link..."></div>
    </div>
    <div style="margin-bottom:0.8rem"><label style="font-size:0.72rem;color:var(--dim)">Kalite Kontrol Notu</label><input id="recNote" placeholder="Sağlam teslim alındı / hasar notu..."></div>
    <div id="recItemsBox" style="margin-bottom:0.9rem"></div>
    <button class="btn" style="width:100%;padding:0.65rem" onclick="submitReceive()">✅ Mal Kabulü Onayla ve Stoğa İşle</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('stok_token') || '';
if (!token) window.location.href = '/';

let pos = [], cols = [], prods = [];

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600); }
async function api(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
  if (res.status === 401) { window.location.href = '/'; return; }
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Hata'); throw new Error(data.error); }
  return data;
}
function logout() { localStorage.removeItem('stok_token'); window.location.href = '/'; }

function showView(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'pending') loadPendingPos();
  if (id === 'waybills') loadWaybills();
  if (id === 'stock') loadStock();
}

async function loadPendingPos() {
  const all = await api('/api/purchasing/orders');
  pos = all.filter(p => p.status === 'approved' || p.status === 'partial');
  const box = document.getElementById('pendingPoList');
  if (!pos.length) { box.innerHTML = '<div class="card" style="color:var(--dim);text-align:center">Şu an mal kabul bekleyen açık sipariş yok.</div>'; return; }
  box.innerHTML = pos.map(p => `
    <div class="card">
      <div class="po-head">
        <div>
          <span class="mono" style="font-weight:800;color:var(--glow)">${p.po_no}</span>
          <strong style="margin-left:0.5rem">${p.supplier_name}</strong>
          ${p.machine_name ? `<span class="badge b-warn" style="margin-left:0.4rem">🏗️ ${p.machine_name}</span>` : ''}
        </div>
        <button class="btn" onclick="openRec(${p.id})">📦 Mal Kabul Yap</button>
      </div>
      <table>
        <thead><tr><th>Malzeme</th><th>Sipariş</th><th>Teslim Alınan</th><th>Kalan</th></tr></thead>
        <tbody>${(p.items || []).map(it => {
          const rem = Math.max(0, parseFloat(it.ordered_qty) - parseFloat(it.received_qty || 0));
          return `<tr>
            <td>${it.description}</td>
            <td class="mono">${parseFloat(it.ordered_qty)}${it.unit}</td>
            <td class="mono" style="color:var(--glow)">${parseFloat(it.received_qty || 0)}</td>
            <td class="mono" style="color:${rem > 0 ? 'var(--accent)' : 'var(--dim)'}"><strong>${rem}</strong></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`).join('');
}

function openRec(poId) {
  const p = pos.find(x => x.id === poId);
  if (!p) return;
  document.getElementById('recPoId').value = p.id;
  document.getElementById('recTitle').textContent = `Mal Kabul — ${p.po_no} (${p.supplier_name})`;
  document.getElementById('recWbNo').value = '';
  document.getElementById('recAttach').value = '';
  document.getElementById('recNote').value = '';
  document.getElementById('recItemsBox').innerHTML = (p.items || []).map(it => {
    const rem = Math.max(0, parseFloat(it.ordered_qty) - parseFloat(it.received_qty || 0));
    if (rem <= 0) return '';
    return `<div style="display:grid;grid-template-columns:1fr 110px;gap:0.5rem;align-items:center;margin-bottom:0.45rem;background:var(--card);padding:0.5rem;border-radius:7px">
      <div><strong>${it.description}</strong><div class="mono" style="font-size:0.7rem;color:var(--dim)">Kalan: ${rem} ${it.unit}</div></div>
      <input type="number" class="rec-qty" data-po-item="${it.id}" data-pid="${it.product_id || ''}" data-desc="${it.description}" data-unit="${it.unit}" value="${rem}" min="0" max="${rem}" step="any">
    </div>`;
  }).join('');
  document.getElementById('receiveModal').classList.add('open');
}
function closeRec() { document.getElementById('receiveModal').classList.remove('open'); }

async function submitReceive() {
  const waybill_no = document.getElementById('recWbNo').value.trim();
  if (!waybill_no) { alert('İrsaliye numarası zorunludur'); return; }
  const items = Array.from(document.querySelectorAll('.rec-qty')).map(inp => ({
    po_item_id: Number(inp.dataset.poItem),
    product_id: inp.dataset.pid ? Number(inp.dataset.pid) : null,
    description: inp.dataset.desc,
    unit: inp.dataset.unit,
    quantity: parseFloat(inp.value) || 0
  })).filter(x => x.quantity > 0);
  if (!items.length) { alert('En az bir kalem için teslim miktarı girin'); return; }

  await api('/api/warehouse/waybills/receive', {
    method: 'POST',
    body: JSON.stringify({
      waybill_no,
      po_id: Number(document.getElementById('recPoId').value),
      attachment_url: document.getElementById('recAttach').value.trim() || null,
      quality_note: document.getElementById('recNote').value.trim(),
      items
    })
  });
  closeRec();
  toast('Mal kabul tamamlandı, stoklar güncellendi ✓');
  loadPendingPos();
}

async function loadWaybills() {
  const rows = await api('/api/warehouse/waybills');
  document.getElementById('wbTbody').innerHTML = rows.map(w => `
    <tr>
      <td class="mono">${String(w.waybill_date).slice(0,10)}</td>
      <td class="mono"><strong>${w.waybill_no}</strong></td>
      <td class="mono">${w.po_no || '—'}</td>
      <td>${w.account_name || '—'}</td>
      <td>${w.received_by_name || '—'}</td>
      <td>${w.quality_note || '—'}</td>
    </tr>`).join('');
}

async function loadStock() {
  [cols, prods] = await Promise.all([api('/api/columns'), api('/api/products')]);
  document.getElementById('stockHead').innerHTML = cols.map(c => `<th>${c.name}</th>`).join('');
  renderStock();
}
function renderStock() {
  const q = (document.getElementById('stockSearch').value || '').toLowerCase();
  const list = q ? prods.filter(p => cols.some(c => String(p.values?.[c.id] || '').toLowerCase().includes(q))) : prods;
  document.getElementById('stockBody').innerHTML = list.slice(0, 150).map(p => `<tr>${cols.map(c => `<td>${p.values?.[c.id] ?? ''}</td>`).join('')}</tr>`).join('');
}

api('/api/me').then(u => { if (u) document.getElementById('userLabel').textContent = u.display_name || u.username; });
loadPendingPos();
</script>
</body>
</html>
