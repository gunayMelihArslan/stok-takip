<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personel Malzeme Çıkış Ekranı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Personel Terminali</div>
    <div>
      <span id="userGreeting" style="margin-right: 1rem; font-weight: 600;"></span>
      <button class="btn btn-danger btn-sm" id="logoutBtn">Çıkış Yap</button>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    <div class="card">
      <div class="card-header">
        <h3>Hızlı Stok Giriş / Çıkış</h3>
      </div>
      <form id="stockActionForm">
        <div class="form-group">
          <label>Malzeme Seçin *</label>
          <select id="productSelect" required>
            <option value="">Yükleniyor...</option>
          </select>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div class="form-group">
            <label>İşlem Türü *</label>
            <select id="actionType" required>
              <option value="OUT">Stok Çıkışı (Malzeme Al)</option>
              <option value="IN">Stok Girişi (İade / İkmal)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Miktar *</label>
            <input type="number" id="actionQty" min="1" value="1" required>
          </div>
        </div>

        <div class="form-group">
          <label>İş Emri / Talep / Açıklama Notu</label>
          <input type="text" id="actionNote" placeholder="Örn: 2026/04 Nolu Vinç Montaj Hattı">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitActionBtn">İşlemi Onayla ve Kaydet</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('userGreeting').textContent = `Personel: ${data.user.username}`;
      } catch {
        window.location.href = '/index.html';
      }
    }

    async function loadSelectProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        const select = document.getElementById('productSelect');
        select.textContent = '';

        const defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '-- Bir Malzeme Seçin --';
        select.appendChild(defaultOpt);

        data.products.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `[${p.code}] ${p.name} - (Mevcut: ${p.stock} ${p.unit})`;
          select.appendChild(opt);
        });
      } catch {
        showToast('Ürün listesi yüklenemedi.', 'error');
      }
    }

    document.getElementById('stockActionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitActionBtn');
      btn.disabled = true;

      const payload = {
        product_id: parseInt(document.getElementById('productSelect').value, 10),
        action_type: document.getElementById('actionType').value,
        quantity: parseInt(document.getElementById('actionQty').value, 10),
        note: document.getElementById('actionNote').value
      };

      try {
        const res = await fetch('/api/stock/transaction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showToast('İşlem başarıyla gerçekleşti.');
        document.getElementById('actionNote').value = '';
        document.getElementById('actionQty').value = '1';
        loadSelectProducts();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    checkAuth().then(loadSelectProducts);
  </script>
</body>
</html>
