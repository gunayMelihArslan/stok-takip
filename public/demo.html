<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Elektrikhane — Canlı Demo & Sunum Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c0f; font-family: var(--sans); }

/* ── ÜST DEMO KONTROL ÇUBUĞU ── */
.demo-control-bar {
  height: 54px;
  background: #11151a;
  border-bottom: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  z-index: 10000;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.demo-logo-box {
  display: flex;
  align-items: center;
  gap: .6rem;
}
.demo-badge-live {
  background: rgba(240,216,0,0.15);
  border: 1px solid rgba(240,216,0,0.35);
  color: var(--accent);
  font-family: var(--mono);
  font-size: .65rem;
  font-weight: 700;
  padding: .2rem .55rem;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* Rol Butonları */
.demo-switcher {
  display: flex;
  background: #1a202c;
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.demo-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-family: var(--sans);
  font-size: .8rem;
  font-weight: 700;
  padding: .35rem .85rem;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: .4rem;
  transition: all .2s;
}
.demo-btn:hover { color: #fff; }
.demo-btn.active {
  background: var(--accent);
  color: #000;
  box-shadow: 0 2px 8px rgba(240,216,0,0.3);
}

/* ── GERÇEK PANEL IFRAME ALANI ── */
.demo-frame-wrap {
  width: 100%;
  height: calc(100% - 54px);
  position: relative;
}
#demoFrame {
  width: 100%;
  height: 100%;
  border: none;
  background: #0a0c0f;
}

@media (max-width: 768px) {
  .demo-control-bar { height: auto; padding: .5rem; flex-direction: column; gap: .4rem; }
  .demo-frame-wrap { height: calc(100% - 85px); }
  .demo-switcher { width: 100%; justify-content: space-between; }
  .demo-btn { flex: 1; justify-content: center; padding: .35rem .2rem; font-size: .72rem; }
}
</style>
</head>
<body>

<div class="demo-control-bar">
  <div class="demo-logo-box">
    <div style="background:#fff;border-radius:6px;padding:.2rem .5rem;display:inline-block">
      <img src="/logo.png" alt="Sekizli" style="height:18px;width:auto;display:block">
    </div>
    <span class="demo-badge-live">⚡ Canlı Demo Simülasyonu</span>
  </div>

  <div class="demo-switcher">
    <button class="demo-btn active" id="btnAdmin" onclick="switchPanel('admin')">👑 Yönetici Paneli</button>
    <button class="demo-btn" id="btnPersonnel" onclick="switchPanel('personnel')">👷 Personel (Atölye)</button>
    <button class="demo-btn" id="btnPurchase" onclick="switchPanel('purchase')">🛒 Satın Alma & Tedarik</button>
  </div>

  <div>
    <button class="btn btn-ghost btn-sm" onclick="resetSandbox()" style="font-size:.7rem;border-color:var(--border2);color:var(--text2)">↺ Demoyu Sıfırla</button>
  </div>
</div>

<div class="demo-frame-wrap">
  <iframe id="demoFrame" src="about:blank"></iframe>
</div>

<script>

let sandboxDB = JSON.parse(JSON.stringify(DEFAULT_MOCK_DB));
let currentRole = 'admin';

function switchPanel(role) {
  currentRole = role;
  document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
  if (role === 'admin') document.getElementById('btnAdmin').classList.add('active');
  if (role === 'personnel') document.getElementById('btnPersonnel').classList.add('active');
  if (role === 'purchase') document.getElementById('btnPurchase').classList.add('active');

  const frame = document.getElementById('demoFrame');
  const targetPage = role === 'admin' ? '/admin.html' : role === 'purchase' ? '/purchase.html' : '/personnel.html';
  frame.src = targetPage;
}

function resetSandbox() {
  sandboxDB = JSON.parse(JSON.stringify(DEFAULT_MOCK_DB));
  const frame = document.getElementById('demoFrame');
  frame.src = frame.src;
}

// ── IFRAME İÇİNDE API İSTEKLERİNİ YAKALAMA VE MOCKLAMA ──
const frame = document.getElementById('demoFrame');
frame.onload = function() {
  try {
    const win = frame.contentWindow;
    if (!win) return;

    // Aktif kullanıcıyı ayarla
    const curUser = sandboxDB.users.find(u => u.role === currentRole) || sandboxDB.users[0];
    win.localStorage.setItem('stok_token', 'demo_token_' + currentRole);

    // Iframe içerisindeki fetch çağrılarını yakala ve mock veritabanına bağla
    win.fetch = async function(url, opts = {}) {
      const u = typeof url === 'string' ? url : url.url;
      const method = (opts.method || 'GET').toUpperCase();
      const body = opts.body ? JSON.parse(opts.body) : {};

      // Helper Response
      const resOk = (data) => new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } });

      if (u.includes('/api/me')) return resOk(curUser);
      if (u.includes('/api/gold')) return resOk({ price: '3450.00', usdtry: '38.20', usd_oz: '2800.00' });
      if (u.includes('/api/notifications')) return resOk([]);
      if (u.includes('/api/active-sessions')) return resOk({ connected_clients: 4 });
      if (u.includes('/api/performance')) return resOk([
        { id: 2, display_name: 'Ahmet Usta', score: 85, completed_stages: 6, in_progress: 1, tx_count: 14, avg_hours: '3.2' },
        { id: 3, display_name: 'Mehmet Usta', score: 60, completed_stages: 4, in_progress: 1, tx_count: 8, avg_hours: '4.1' }
      ]);

      // Sütunlar & Kategoriler & BOM
      if (u.includes('/api/columns')) return resOk(sandboxDB.columns);
      if (u.includes('/api/bom-categories')) return resOk(sandboxDB.bom_categories);
      if (u.includes('/api/bom-columns')) return resOk(sandboxDB.bom_columns);

      // Ürünler & Stok
      if (u.includes('/api/lots/counts')) {
        const counts = {};
        sandboxDB.product_lots.forEach(l => { counts[l.product_id] = (counts[l.product_id] || 0) + 1; });
        return resOk(counts);
      }
      if (u.includes('/api/products') && method === 'GET') {
        const idMatch = u.match(/\/api\/products\/(\d+)\/lots/);
        if (idMatch) return resOk(sandboxDB.product_lots.filter(l => l.product_id == idMatch[1]));
        return resOk(sandboxDB.products);
      }
      if (u.includes('/api/products') && method === 'POST') {
        const newP = { id: Date.now(), values: body.values || {}, display_order: sandboxDB.products.length + 1 };
        sandboxDB.products.push(newP);
        return resOk(newP);
      }

      // Firmalar
      if (u.includes('/api/firms')) return resOk(sandboxDB.firms);

      // Vinçler & Reçeteler
      if (u.includes('/api/machines')) {
        const midMatch = u.match(/\/api\/machines\/(\d+)\/taken/);
        if (midMatch) return resOk({});
        const enriched = sandboxDB.machines.map(m => {
          const f = sandboxDB.firms.find(x => x.id === m.firm_id);
          return {
            ...m,
            firm_name: f ? f.name : '',
            items: (m.items || []).map(it => {
              const p = sandboxDB.products.find(x => x.id == it.product_id);
              return { ...it, product_name: p ? (p.values['1'] || `#${p.id}`) : '—' };
            })
          };
        });
        return resOk(enriched);
      }

      // İş Panosu & Aşamalar
      if (u.includes('/api/tasks') && method === 'GET') {
        const enrichedTasks = sandboxDB.tasks.map(t => {
          const f = sandboxDB.firms.find(x => x.id === t.firm_id);
          const stages = sandboxDB.task_stages.filter(s => s.task_id === t.id).map(s => {
            const u = sandboxDB.users.find(x => x.id === s.assigned_to);
            return { ...s, assignee_name: u ? u.display_name : null };
          });
          return { ...t, firm_name: f ? f.name : '', stages };
        });
        return resOk(enrichedTasks);
      }
      if (u.includes('/api/task-stages/') && u.includes('/take')) {
        const sid = u.match(/\/api\/task-stages\/(\d+)\/take/)[1];
        const stg = sandboxDB.task_stages.find(s => s.id == sid);
        if (stg) { stg.assigned_to = curUser.id; stg.status = 'in_progress'; }
        return resOk({ ok: true });
      }
      if (u.includes('/api/task-stages/') && u.includes('/complete')) {
        const sid = u.match(/\/api\/task-stages\/(\d+)\/complete/)[1];
        const stg = sandboxDB.task_stages.find(s => s.id == sid);
        if (stg) { stg.status = 'completed'; }
        return resOk({ ok: true });
      }
      if (u.includes('/api/task-transfers/pending')) return resOk([]);

      // Stok İşlemleri
      if (u.includes('/api/transactions')) {
        if (method === 'POST') {
          const tx = { id: Date.now(), user_id: curUser.id, user_name: curUser.display_name, product_name: 'Malzeme', ...body, created_at: new Date() };
          sandboxDB.transactions.unshift(tx);
          return resOk(tx);
        }
        const txEnriched = sandboxDB.transactions.map(t => {
          const p = sandboxDB.products.find(x => x.id == t.product_id);
          const u = sandboxDB.users.find(x => x.id == t.user_id);
          return { ...t, user_name: u ? u.display_name : 'Personel', product_name: p ? p.values['1'] : 'Malzeme' };
        });
        return resOk(txEnriched);
      }

      // Satın Alma
      if (u.includes('/api/purchase-requests')) {
        if (method === 'POST') {
          const pr = { id: Date.now(), requested_by: curUser.id, requester_name: curUser.display_name, status: 'approved', created_at: new Date(), ...body };
          sandboxDB.purchases.unshift(pr);
          return resOk(pr);
        }
        return resOk(sandboxDB.purchases);
      }
      if (u.includes('/status') && method === 'PUT') {
        const pid = u.match(/\/api\/purchase-requests\/(\d+)\/status/)[1];
        const pr = sandboxDB.purchases.find(p => p.id == pid);
        if (pr) { pr.status = body.status; if (body.admin_note) pr.admin_note = body.admin_note; }
        return resOk({ ok: true });
      }

      // Sürücü & VFD Rehberi
      if (u.includes('/api/vfd/devices')) return resOk(sandboxDB.vfd_devices);
      if (u.includes('/api/vfd/records')) {
        const enrichedVfd = sandboxDB.vfd_records.map(r => {
          const dev = sandboxDB.vfd_devices.find(d => d.id === r.device_id);
          return { ...r, brand: dev ? dev.brand : '', model: dev ? dev.model : '' };
        });
        return resOk(enrichedVfd);
      }

      // Kullanıcılar & Aktivite
      if (u.includes('/api/users')) return resOk(sandboxDB.users);
      if (u.includes('/api/activity-logs')) return resOk(sandboxDB.activity_logs);

      return resOk({ ok: true });
    };

    // SSE Mock
    win.EventSource = function() {
      return { addEventListener: () => {}, close: () => {} };
    };

  } catch(e) {
    console.warn('Iframe sandbox initialization error:', e);
  }
};

document.addEventListener('DOMContentLoaded', () => {
  switchPanel('admin');
});
</script>
</body>
</html>
